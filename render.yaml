services:
  - type: web
    name: ktu-excuse-court
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: excuse-court-db
          property: connectionString
      - key: ADMIN_CODE
        sync: false
      - key: JUDGE_CODE
        sync: false
      - key: JURY_CODE
        sync: false
      - key: STUDENT_CODE
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
databases:
  - name: excuse-court-db
    plan: free
